<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Checkout for Hotstar | Tejas Dua</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23020a1e'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='19' fill='%239febe0' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E">
<link rel="preload" as="image" href="case/hotstar/01.webp">
<link rel="stylesheet" href="deck.css?v=4">
</head>
<body>

<main class="deck js-deck">
  <div class="deck-stage"></div>

  <div class="deck-chrome">
    <div class="deck-bar deck-bar-top">
      <a class="deck-label" href="index.html">&larr; All work</a>
      <span class="deck-label">Quick Checkout &middot; Disney+ Hotstar</span>
    </div>

    <div class="deck-rail js-deck-rail" aria-hidden="true"></div>

    <div class="deck-bar deck-bar-bottom">
      <div class="deck-nav">
        <button class="deck-btn js-deck-prev" type="button" aria-label="Previous slide">
          <svg width="13" height="13" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M9 2L4 7L9 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span class="deck-counter js-deck-counter">1 / 30</span>
        <button class="deck-btn js-deck-next" type="button" aria-label="Next slide">
          <svg width="13" height="13" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M5 2L10 7L5 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <span class="deck-label">Esc to exit</span>
    </div>

    <div class="deck-hint">Scroll or use &larr; &rarr; to move</div>

    <div class="deck-rotate">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="1.5" y="4.5" width="13" height="7" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M8 1.2v1.6M6.6 2.2L8 .8l1.4 1.4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Turn sideways to read
    </div>
  </div>
</main>

<script src="js/deck.js?v=2"></script>
<script>
(function () {
  var root = document.querySelector('.js-deck');
  if (!root || !window.Deck) return;
  new Deck(root, {
    dir: 'case/hotstar/',
    ext: 'webp',
    count: 30,
    width: 2560,
    height: 1440,
    exit: 'index.html'
  });
})();
</script>

</body>
</html>
